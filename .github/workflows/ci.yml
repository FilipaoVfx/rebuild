name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Mismas extensiones que Supabase (verificado: postgis, pgrouting,
        # pgmq, pg_cron, pgaudit, pgtap estan disponibles en el plan gestionado).
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: uri
          POSTGRES_PASSWORD: uri
          POSTGRES_DB: uri
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      URI_DATABASE_URL: postgresql://uri:uri@127.0.0.1:5433/uri
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Instalar pgRouting
        run: |
          docker exec $(docker ps -qf "ancestor=postgis/postgis:16-3.4") \
            sh -c "apt-get update -qq && apt-get install -y -qq postgresql-16-pgrouting"

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      # ADR-01: las fronteras entre modulos las verifica CI, no la disciplina.
      - name: Fronteras de importacion (ADR-01)
        run: lint-imports

      - name: Migraciones
        run: python scripts/migrate.py

      # FR-PII-02: si una migracion introduce una columna de datos personales,
      # el build falla. Es el unico control que atrapa esa clase de error.
      - name: Pruebas
        run: pytest -q
