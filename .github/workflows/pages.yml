name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nota: mientras la rama por defecto del repositorio no sea `main`, el
# disparador de push no se activa. `workflow_dispatch` sí funciona desde la
# rama por defecto, sea cual sea.

# Un solo despliegue a la vez; no cancela el que está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: uri
          POSTGRES_PASSWORD: uri
          POSTGRES_DB: uri
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      URI_DATABASE_URL: postgresql://uri:uri@127.0.0.1:5433/uri
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" httpx

      - name: Instalar pgRouting
        run: |
          docker exec $(docker ps -qf "ancestor=postgis/postgis:16-3.4") \
            sh -c "apt-get update -qq && apt-get install -y -qq postgresql-16-pgrouting"

      # El extracto de OSM está versionado en db/seed/ — no se descarga.
      # Una descarga aquí ataría cada despliegue a que Overpass esté en pie
      # ese día, y ya falló así una vez: el bucle de curl no abortaba el paso,
      # así que el error reaparecía tres pasos después disfrazado de otra cosa.
      - name: Verificar el extracto archivado
        run: |
          test -s db/seed/osm_pereira.json.gz \
            || { echo "::error::falta db/seed/osm_pereira.json.gz"; exit 1; }
          echo "extracto OSM: $(du -h db/seed/osm_pereira.json.gz | cut -f1)"

      # El sitio publicado corre sobre DATOS REALES: daño de Copernicus EMS
      # (EMSR916, CC BY 4.0), huellas de Microsoft, amenaza del SGC y contexto
      # de OSM. Ya no hay capas simuladas — la migración 006 las prohíbe en la
      # base. El paso siguiente verifica que ninguna fuente no redistribuible
      # llegó a contribuir.
      - name: Migraciones y pipeline
        run: |
          python scripts/migrate.py
          python scripts/run_pipeline.py

      - name: Construir paquete estático (con puerta de licencia)
        run: python scripts/build_static.py --profile PUBLIC

      # PASO MANUAL, UNA SOLA VEZ, ANTES DEL PRIMER DESPLIEGUE:
      #   Settings -> Pages -> Source: GitHub Actions
      #
      # No se puede automatizar. `enablement: true` existe en esta action pero
      # crear un sitio de Pages por API exige permisos de administrador del
      # repositorio, y el GITHUB_TOKEN de un workflow no los tiene por mucho
      # que se le conceda `pages: write`:
      #
      #   Create Pages site failed. Error: Resource not accessible by integration
      #
      # `pages: write` habilita DESPLEGAR en un sitio que ya existe, no crearlo.
      # Una vez activado a mano, todo lo demás es automático.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
