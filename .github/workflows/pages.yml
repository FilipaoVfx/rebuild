name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un solo despliegue a la vez; no cancela el que está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: uri
          POSTGRES_PASSWORD: uri
          POSTGRES_DB: uri
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      URI_DATABASE_URL: postgresql://uri:uri@127.0.0.1:5433/uri
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" httpx

      - name: Instalar pgRouting
        run: |
          docker exec $(docker ps -qf "ancestor=postgis/postgis:16-3.4") \
            sh -c "apt-get update -qq && apt-get install -y -qq postgresql-16-pgrouting"

      # El paquete publicado se reconstruye desde las fuentes en cada
      # despliegue. `data/raw/` no está versionado, así que se descarga aquí:
      # lo que se publica es reproducible desde el repositorio, no un volcado
      # que alguien generó en su máquina.
      - name: Descargar datos de origen
        run: |
          mkdir -p data/raw
          curl -sSf --retry 3 -o data/raw/sertit_damage.geojson \
            https://datosdelterremoto.org/data/public/sertit_damage.geojson
          curl -sSf --retry 3 -o data/raw/unosat_damage.geojson \
            https://datosdelterremoto.org/data/public/unosat_damage.geojson
          for host in overpass.kumi.systems overpass-api.de; do
            curl -sSf --max-time 300 -X POST \
              --data-urlencode "data@db/seed/pereira.overpass" \
              "https://$host/api/interpreter" -o data/raw/osm_pereira.json && break
          done
          ls -la data/raw/

      - name: Migraciones y pipeline
        run: |
          python scripts/migrate.py
          python scripts/run_pipeline.py

      - name: Construir paquete estático
        run: python scripts/build_static.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
