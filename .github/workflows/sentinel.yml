name: Sentinel

# Manual, no programado. Cada corrida gasta cuota de proceso de CDSE (10.000
# PU/mes en el tier gratuito), y una descarga que nadie pidió es cuota que
# nadie recupera. Cuando el pipeline esté rodado, añadir un `schedule` aquí
# es una línea.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo catalogar y elegir, sin descargar (no gasta PU de proceso)"
        type: boolean
        default: true
      bbox:
        description: "AOI: min_lon,min_lat,max_lon,max_lat. Vacío = el AOI de EMSR916"
        type: string
        default: ""

# Una corrida a la vez: dos escribiendo escenas en la misma base se pisan.
concurrency:
  group: sentinel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      # Las credenciales entran SOLO por aquí. Nunca en un archivo del
      # repositorio, nunca en el visor. El adaptador las lee del entorno y no
      # las escribe en la procedencia: `request_parameters` guarda qué se
      # pidió, no con qué llave.
      CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
      CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
      # Session pooler de Supabase, puerto 5432. NO la conexión directa: las
      # conexiones directas de Supabase son IPv6 en el plan Free y los runners
      # de GitHub Actions son IPv4 — la propia documentación de Supabase lista
      # GitHub Actions entre las plataformas que solo aceptan IPv4.
      # Tampoco el puerto 6543 (modo transacción): no admite prepared
      # statements, y psycopg3 los usa.
      URI_DATABASE_URL: ${{ secrets.URI_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Falla temprano y con un mensaje, en vez de a mitad del catálogo con un
      # error de conexión que parece otra cosa.
      - name: Comprobar que los secretos están configurados
        run: |
          missing=""
          [ -n "$CDSE_CLIENT_ID" ]     || missing="$missing CDSE_CLIENT_ID"
          [ -n "$CDSE_CLIENT_SECRET" ] || missing="$missing CDSE_CLIENT_SECRET"
          [ -n "$URI_DATABASE_URL" ]   || missing="$missing URI_DATABASE_URL"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos del repositorio:$missing"
            echo "Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          echo "los tres secretos están presentes"

      # Diagnostico de la cadena de conexion, SIN la contraseña.
      #
      # Dos corridas se fueron en adivinar por que la autenticacion fallaba.
      # El secreto no se puede leer desde fuera, asi que el unico sitio donde
      # se puede mirar es aqui dentro — y lo que hace falta ver (usuario, host,
      # puerto) no es el secreto. La contraseña no se imprime ni su longitud
      # exacta: solo si esta presente y si lleva caracteres que obligan a
      # percent-encodear.
      # Diagnostico de la cadena de conexion, SIN la contraseña.
      #
      # Se parsea a mano y no con urlsplit: urlsplit revienta con
      # `_check_bracketed_netloc` si la cadena lleva corchetes —lo que pasa
      # cuando alguien deja el marcador `[TU-PASSWORD]` sin sustituir— y un
      # diagnostico que se cae ante el error que existe para detectar no sirve
      # de nada. Nada de lo que se imprime es el secreto: usuario, host y
      # puerto no lo son, y la contraseña no se muestra ni se mide.
      - name: Comprobar la forma de URI_DATABASE_URL
        run: |
          python - <<'PY'
          import os, sys

          raw = os.environ["URI_DATABASE_URL"].strip()
          problemas = []

          esquema, _, resto = raw.partition("://")
          if not resto:
              print("::error::la cadena no tiene forma postgresql://usuario:clave@host:puerto/base")
              sys.exit(1)

          # El host empieza tras el ULTIMO '@': una contraseña puede llevar '@'.
          userinfo, _, hostpart = resto.rpartition("@")
          usuario, _, clave = userinfo.partition(":")
          hostport, _, base = hostpart.partition("/")
          host, _, puerto = hostport.rpartition(":") if ":" in hostport else (hostport, "", "")

          print(f"  esquema : {esquema}")
          print(f"  usuario : {usuario or '(vacio)'}")
          print(f"  host    : {host or '(vacio)'}")
          print(f"  puerto  : {puerto or '(sin puerto)'}")
          print(f"  base    : {base or '(vacia)'}")
          print(f"  password: {'presente' if clave else 'AUSENTE'}")

          if "[" in userinfo or "]" in userinfo:
              problemas.append(
                  "la cadena conserva corchetes: el marcador de la plantilla "
                  "(p. ej. [TU-PASSWORD]) no se sustituyo por la contraseña real"
              )
          if not usuario:
              problemas.append("sin usuario")
          elif "pooler.supabase.com" in host and "." not in usuario:
              problemas.append(
                  f"el pooler exige usuario 'postgres.<project-ref>'; llega '{usuario}'"
              )
          if not clave:
              problemas.append("sin contraseña")
          if puerto == "6543":
              problemas.append("puerto 6543 (modo transaccion) no admite prepared statements")
          if host.startswith("db.") and host.endswith(".supabase.co"):
              problemas.append("conexion directa: es IPv6 y los runners de Actions son IPv4")
          # Estos rompen el parseo de la URI y el fallo aflora como otra cosa.
          if any(c in clave for c in "@/?#[]"):
              problemas.append(
                  "la contraseña lleva caracteres que hay que percent-encodear "
                  "(@ -> %40, / -> %2F, ? -> %3F, # -> %23)"
              )

          for problema in problemas:
              print(f"::error::{problema}")
          sys.exit(1 if problemas else 0)
          PY

      # Idempotente: el registro de migraciones dice cuáles faltan. Sobre una
      # base ya migrada no hace nada.
      #
      # SI FALLA CON `password authentication failed for user "postgres"`:
      # el nombre del usuario en ese mensaje NO es la pista. Supavisor usa el
      # sufijo `.<project-ref>` solo para enrutar al proyecto y luego autentica
      # contra el rol real de Postgres, que se llama `postgres` a secas. El
      # paso anterior ya comprobó que el usuario de la cadena lleva su sufijo,
      # así que un fallo aquí es la CONTRASEÑA, no el usuario. Se comprueba en
      # dos segundos desde cualquier máquina:
      #
      #   psql "$URI_DATABASE_URL" -c "select 1"
      - name: Migraciones
        run: python scripts/migrate.py

      - name: Catalogar y recortar
        run: |
          args=""
          [ "${{ inputs.dry_run }}" = "true" ] && args="--dry-run"
          [ -n "${{ inputs.bbox }}" ] && args="$args --bbox ${{ inputs.bbox }}"
          python scripts/fetch_sentinel.py $args

      # El terreno es otra fuente y otra licencia: el WorldDEM-30 es un
      # producto de Airbus que la UE sublicencia, auditado aparte en
      # db/terms/copernicus_dem_glo30_licence_20260916.txt. Son 10 teselas
      # para todo el AOI, asi que cuesta practicamente nada.
      - name: Terreno (Copernicus DEM GLO-30)
        if: ${{ inputs.dry_run == false }}
        run: python scripts/fetch_terrain.py

      # Los GeoTIFF no se versionan (data/sentinel/README.md): se reconstruyen
      # desde `scene_id` + `request_parameters`, que sí quedan en la base. El
      # artefacto es para poder mirarlos sin volver a pedirlos a CDSE.
      - name: Publicar los recortes como artefacto
        if: ${{ inputs.dry_run == false }}
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-aoi-${{ github.run_number }}
          # Los tres productos, no solo el GeoTIFF: la vista PNG y el
          # indice son lo que consume el visor, y subir solo los .tif ya
          # hizo que una corrida pareciera identica a la anterior.
          path: |
            data/sentinel/**/*.tif
            data/sentinel/**/*.png
            data/sentinel/previews.json
            data/terrain/**/*.png
            data/terrain/terrain.json
          if-no-files-found: warn
          retention-days: 30

      - name: Qué quedó en la base
        if: always()
        run: |
          python - <<'PY'
          from uri.db import worker_connection
          with worker_connection() as conn, conn.cursor() as cur:
              cur.execute("""
                  SELECT collection::text, event_window::text,
                         count(*) AS escenas,
                         count(*) FILTER (WHERE selected) AS elegidas
                  FROM rebuild_core.satellite_scene
                  GROUP BY 1, 2 ORDER BY 1, 2
              """)
              filas = cur.fetchall()
          if not filas:
              print("sin escenas registradas")
          for f in filas:
              print(f"  {f['collection']:16} {f['event_window']:5} "
                    f"{f['escenas']:3} consideradas, {f['elegidas']} elegida(s)")
          PY
